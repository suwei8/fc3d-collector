name: collect

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "指定期号（留空则采集上游最新期）"
        required: false
        type: string
      from_issue:
        description: "回填起始期号（如 2026234），配合 to_issue 使用"
        required: false
        type: string
      to_issue:
        description: "回填结束期号（如 2026263），配合 from_issue 使用"
        required: false
        type: string
      test_notify:
        description: "测试：跳过变更检查，强制推送最新一期到 Telegram"
        required: false
        type: boolean
        default: false
  schedule:
    # 上游发布时间（北京时间）：太湖一语 ~17:31；官方试机号 ~18:05-18:10 试摇，
    # 天齐网 ~18:10 更新；牛彩网汇总 ~17:05 建站、试机号谜语 18:10 后编辑补入。
    # 18:25 首跑，18:55/19:35 兜底补 cz89 后编辑字段与天齐网偶发延迟。
    - cron: "25 10 * * *"
    - cron: "55 10 * * *"
    - cron: "35 11 * * *"
    # 北京时间 21:30、22:10：当天 21:15 已开奖，补采最新期开奖号（collect.py 只在缺失时回填）。
    - cron: "30 13 * * *"
    - cron: "10 14 * * *"

permissions:
  contents: read

concurrency:
  group: fc3d-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: collector

      # 私有归档仓库通过 deploy key（仅授权 fc3d-archive，可写）检出；
      # 采集结果直接 commit + push 到该仓库，本仓库不存数据。
      - name: Checkout private archive
        uses: actions/checkout@v4
        with:
          repository: suwei8/fc3d-archive
          ssh-key: ${{ secrets.ARCHIVE_SSH_KEY }}
          path: archive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install dependencies
        run: pip install -r collector/requirements.txt

      - name: Run tests
        working-directory: collector
        env:
          PYTHONPATH: .
          FC3D_ROOT: ${{ github.workspace }}/archive
        run: pytest -q

      - name: Collect
        env:
          FC3D_ROOT: ${{ github.workspace }}/archive
          ISSUE: ${{ inputs.issue }}
          FROM_ISSUE: ${{ inputs.from_issue }}
          TO_ISSUE: ${{ inputs.to_issue }}
        run: |
          if [ -n "$FROM_ISSUE" ] && [ -n "$TO_ISSUE" ]; then
            # 回填模式：cz89 列表索引 + 太湖翻页 + 新浪开奖一次搞定，跨年无效期号自动跳过
            python collector/scripts/collect.py --from "$FROM_ISSUE" --to "$TO_ISSUE"
          elif [ -n "$ISSUE" ]; then
            python collector/scripts/collect.py --issue "$ISSUE"
          else
            python collector/scripts/collect.py
          fi

      - name: Commit changed archive files
        id: commit
        working-directory: archive
        run: |
          # git diff does not report brand-new untracked files, so inspect
          # the working tree directly. This is important when a new issue
          # creates data/YYYY/YYYYNNN.md and raw/YYYY/YYYYNNN.json.
          if [ -z "$(git status --porcelain -- data raw)" ]; then
            echo "No archive changes."
            exit 0
          fi

          git config user.name "fc3d-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data raw

          # Guard again after staging.
          if git diff --cached --quiet; then
            echo "Nothing staged."
            exit 0
          fi

          git commit -m "data: collect $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: steps.commit.outputs.changed == 'true' || github.event.inputs.test_notify == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python collector/scripts/notify_telegram.py archive
